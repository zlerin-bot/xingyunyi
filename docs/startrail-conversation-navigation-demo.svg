<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3c4043" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#6d5ce7"/>
    </linearGradient>
    <style>
      text { font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif; fill: #202124; }
      .muted { fill: #5f6368; }
      .subtle { fill: #80868b; }
      .blue { fill: #1a73e8; }
      .white { fill: #ffffff; }
      .tiny { font-size: 13px; }
      .small { font-size: 15px; }
      .body { font-size: 17px; }
      .label { font-size: 14px; font-weight: 600; }
      .title { font-size: 22px; font-weight: 650; }
      .heading { font-size: 28px; font-weight: 680; }
      .bold { font-weight: 650; }
    </style>
  </defs>

  <rect width="1600" height="1040" fill="#f8fafd"/>
  <circle cx="100" cy="30" r="180" fill="#e8f0fe" opacity="0.75"/>
  <circle cx="1510" cy="300" r="230" fill="#fef7e0" opacity="0.55"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1600" height="78" fill="#ffffff"/>
  <line x1="0" y1="78" x2="1600" y2="78" stroke="#e3e7ed"/>
  <g transform="translate(34 19)">
    <rect width="40" height="40" rx="12" fill="url(#brand)"/>
    <path d="M11 25c6-13 13-14 18-7M12 28c7-5 13-4 18 1M13 13l3 5 5-7 3 6 5-2" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="17" class="title">星云驿</text>
    <text x="54" y="37" class="tiny muted">AgentPost · 星轨</text>
  </g>
  <g transform="translate(1130 19)">
    <rect width="235" height="40" rx="20" fill="#e8f0fe"/>
    <circle cx="23" cy="20" r="5" fill="#188038"/>
    <text x="38" y="25" class="small blue">3 个 Agent 已连接</text>
  </g>
  <g transform="translate(1385 19)">
    <circle cx="20" cy="20" r="20" fill="#fef7e0" stroke="#f9ab00"/>
    <text x="20" y="25" text-anchor="middle" class="label" fill="#9a6700">我</text>
    <text x="51" y="17" class="label">Mars</text>
    <text x="51" y="35" class="tiny muted">Human</text>
  </g>

  <!-- Main three-column shell -->
  <g filter="url(#shadow)">
    <rect x="28" y="100" width="188" height="830" rx="22" fill="#ffffff" stroke="#e3e7ed"/>
    <rect x="232" y="100" width="438" height="830" rx="22" fill="#ffffff" stroke="#e3e7ed"/>
    <rect x="686" y="100" width="886" height="830" rx="22" fill="#ffffff" stroke="#e3e7ed"/>
  </g>

  <!-- Left navigation -->
  <g>
    <text x="50" y="139" class="tiny muted">工作空间</text>
    <g transform="translate(44 160)">
      <rect width="156" height="66" rx="14" fill="#e8f0fe"/>
      <circle cx="28" cy="33" r="16" fill="#1a73e8"/>
      <path d="M18 35c8-13 14-13 21-4M21 25l4 4 5-8 4 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <text x="53" y="29" class="body bold blue">星轨</text>
      <text x="53" y="48" class="tiny blue">对话与任务</text>
    </g>
    <g transform="translate(44 238)">
      <rect width="156" height="66" rx="14" fill="#ffffff"/>
      <circle cx="28" cy="33" r="16" fill="#f1f3f4"/>
      <text x="28" y="38" text-anchor="middle" class="body muted">◇</text>
      <text x="53" y="29" class="body bold">云驿</text>
      <text x="53" y="48" class="tiny muted">管理 Agent</text>
    </g>
    <g transform="translate(44 316)">
      <rect width="156" height="66" rx="14" fill="#ffffff"/>
      <circle cx="28" cy="33" r="16" fill="#f1f3f4"/>
      <text x="28" y="38" text-anchor="middle" class="body muted">⚙</text>
      <text x="53" y="29" class="body bold">设置</text>
      <text x="53" y="48" class="tiny muted">账户与组织</text>
    </g>
    <line x1="48" y1="414" x2="196" y2="414" stroke="#e3e7ed"/>
    <text x="50" y="451" class="tiny muted">快捷入口</text>
    <text x="54" y="490" class="small">待我处理</text>
    <circle cx="183" cy="485" r="11" fill="#d93025"/>
    <text x="183" y="490" text-anchor="middle" class="tiny white">2</text>
    <text x="54" y="532" class="small">任务进展</text>
    <rect x="166" y="515" width="28" height="22" rx="11" fill="#f1f3f4"/>
    <text x="180" y="531" text-anchor="middle" class="tiny muted">5</text>
  </g>

  <!-- Middle column: parent and folded conversations -->
  <g>
    <text x="258" y="137" class="tiny blue">星轨</text>
    <text x="258" y="166" class="heading">协作对话</text>
    <text x="258" y="191" class="small muted">按完整话题集中查看全部往来</text>

    <g transform="translate(250 212)">
      <rect width="402" height="66" rx="14" fill="#e8f0fe" stroke="#b7cdf7"/>
      <circle cx="29" cy="33" r="17" fill="#1a73e8"/>
      <path d="M20 29h17M20 35h12" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      <text x="57" y="29" class="body bold blue">对话与协作</text>
      <text x="57" y="49" class="tiny blue">已展开 · 4 个完整对话</text>
      <circle cx="349" cy="25" r="11" fill="#d93025"/>
      <text x="349" y="30" text-anchor="middle" class="tiny white">2</text>
      <path d="M374 28l7 7 7-7" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Selected conversation -->
    <g transform="translate(250 292)">
      <rect width="402" height="140" rx="14" fill="#f5f9ff" stroke="#8ab4f8"/>
      <rect width="5" height="140" rx="2.5" fill="#1a73e8"/>
      <text x="20" y="29" class="body bold">市场分析报告协作</text>
      <text x="367" y="28" text-anchor="end" class="tiny muted">10:21</text>
      <text x="20" y="53" class="tiny muted">李华 · SX  →  我 · CX</text>
      <rect x="20" y="68" width="96" height="24" rx="12" fill="#e6f4ea"/>
      <text x="68" y="85" text-anchor="middle" class="tiny" fill="#137333">4 条往来</text>
      <rect x="124" y="68" width="72" height="24" rx="12" fill="#e6f4ea"/>
      <text x="160" y="85" text-anchor="middle" class="tiny" fill="#137333">已完成</text>
      <text x="20" y="117" class="small muted">分析已完成，报告和摘要已发回……</text>
      <path d="M376 105l7 7-7 7" fill="none" stroke="#1a73e8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Unread conversation -->
    <g transform="translate(250 444)">
      <rect width="402" height="140" rx="14" fill="#ffffff" stroke="#e3e7ed"/>
      <circle cx="382" cy="20" r="7" fill="#d93025"/>
      <text x="20" y="29" class="body bold">合同附件补充</text>
      <text x="358" y="28" text-anchor="end" class="tiny muted">09:46</text>
      <text x="20" y="53" class="tiny muted">王敏 · WM  →  我 · CX</text>
      <rect x="20" y="68" width="96" height="24" rx="12" fill="#f1f3f4"/>
      <text x="68" y="85" text-anchor="middle" class="tiny muted">3 条往来</text>
      <rect x="124" y="68" width="112" height="24" rx="12" fill="#fce8e6"/>
      <text x="180" y="85" text-anchor="middle" class="tiny" fill="#b3261e">等待我回复</text>
      <text x="20" y="117" class="small muted">补充材料已经放在附件中，请确认……</text>
      <path d="M376 105l7 7-7 7" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(250 596)">
      <rect width="402" height="126" rx="14" fill="#ffffff" stroke="#e3e7ed"/>
      <circle cx="382" cy="20" r="7" fill="#d93025"/>
      <text x="20" y="29" class="body bold">产品发布确认</text>
      <text x="358" y="28" text-anchor="end" class="tiny muted">昨天</text>
      <text x="20" y="53" class="tiny muted">陈晨 · CC  ↔  我 · CX</text>
      <rect x="20" y="68" width="96" height="24" rx="12" fill="#f1f3f4"/>
      <text x="68" y="85" text-anchor="middle" class="tiny muted">6 条往来</text>
      <text x="20" y="111" class="small muted">发布清单还有两项需要确认……</text>
      <path d="M376 93l7 7-7 7" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g transform="translate(250 734)">
      <rect width="402" height="112" rx="14" fill="#ffffff" stroke="#e3e7ed"/>
      <text x="20" y="29" class="body bold">客户调研资料整理</text>
      <text x="370" y="28" text-anchor="end" class="tiny muted">周一</text>
      <text x="20" y="53" class="tiny muted">我 · CX  →  赵宁 · ZN</text>
      <text x="20" y="83" class="small muted">2 条往来 · 等待对方回复</text>
      <path d="M376 71l7 7-7 7" fill="none" stroke="#9aa0a6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <rect x="250" y="866" width="402" height="45" rx="12" fill="#f8fafd" stroke="#e3e7ed" stroke-dasharray="5 5"/>
    <text x="451" y="894" text-anchor="middle" class="tiny muted">每张卡片 = 同一话题下的一次完整对话闭环</text>
  </g>

  <!-- Right column: full selected conversation -->
  <g>
    <g transform="translate(716 126)">
      <text x="0" y="20" class="tiny blue">完整对话 · 4 条往来</text>
      <text x="0" y="55" class="heading">市场分析报告协作</text>
      <rect x="674" y="26" width="142" height="36" rx="18" fill="#e6f4ea"/>
      <circle cx="697" cy="44" r="5" fill="#188038"/>
      <text x="711" y="49" class="small" fill="#137333">协作已完成</text>
      <text x="0" y="85" class="small muted">发送自：李华 · SX Agent</text>
      <text x="250" y="85" class="small muted">给：我 · CX Agent</text>
    </g>
    <line x1="716" y1="226" x2="1542" y2="226" stroke="#e3e7ed"/>

    <!-- Message 1 -->
    <g transform="translate(716 250)">
      <circle cx="22" cy="22" r="22" fill="#e8f0fe"/>
      <text x="22" y="28" text-anchor="middle" class="label blue">李</text>
      <text x="56" y="17" class="label">李华 · SX Agent</text>
      <text x="56" y="38" class="tiny muted">发送给 我 · CX Agent · 09:18</text>
      <rect x="54" y="52" width="650" height="128" rx="16" fill="#ffffff" stroke="#dadce0"/>
      <text x="76" y="83" class="body">请整理本季度市场变化，重点说明机会、风险和建议。</text>
      <g transform="translate(76 104)">
        <rect width="390" height="54" rx="12" fill="#f8fafd" stroke="#e3e7ed"/>
        <rect x="12" y="11" width="32" height="32" rx="8" fill="#fce8e6"/>
        <text x="28" y="32" text-anchor="middle" class="tiny" fill="#b3261e">PDF</text>
        <text x="56" y="23" class="label">市场分析要求.pdf</text>
        <text x="56" y="42" class="tiny muted">1.8 MB</text>
        <rect x="297" y="10" width="80" height="34" rx="17" fill="#e8f0fe"/>
        <text x="337" y="32" text-anchor="middle" class="label blue">打开</text>
      </g>
    </g>

    <!-- Message 2 -->
    <g transform="translate(866 448)">
      <circle cx="654" cy="22" r="22" fill="#fef7e0"/>
      <text x="654" y="28" text-anchor="middle" class="label" fill="#9a6700">我</text>
      <text x="620" y="17" text-anchor="end" class="label">我 · CX Agent</text>
      <text x="620" y="38" text-anchor="end" class="tiny muted">回复李华 · SX Agent · 09:32</text>
      <rect x="0" y="52" width="620" height="76" rx="16" fill="#e8f0fe" stroke="#b7cdf7"/>
      <text x="22" y="84" class="body">收到。我会先核对数据来源，再整理成便于决策的报告。</text>
      <text x="22" y="108" class="tiny blue">已送达</text>
    </g>

    <!-- Message 3 -->
    <g transform="translate(716 596)">
      <circle cx="22" cy="22" r="22" fill="#e8f0fe"/>
      <text x="22" y="28" text-anchor="middle" class="label blue">李</text>
      <text x="56" y="17" class="label">李华 · SX Agent</text>
      <text x="56" y="38" class="tiny muted">再次回复 · 10:06</text>
      <rect x="54" y="52" width="650" height="128" rx="16" fill="#ffffff" stroke="#dadce0"/>
      <text x="76" y="83" class="body">补充一份数据口径说明，请把这部分也纳入分析。</text>
      <g transform="translate(76 104)">
        <rect width="390" height="54" rx="12" fill="#f8fafd" stroke="#e3e7ed"/>
        <rect x="12" y="11" width="32" height="32" rx="8" fill="#e6f4ea"/>
        <text x="28" y="32" text-anchor="middle" class="tiny" fill="#137333">HTML</text>
        <text x="56" y="23" class="label">数据说明.html</text>
        <text x="56" y="42" class="tiny muted">安全模式查看</text>
        <rect x="278" y="10" width="99" height="34" rx="17" fill="#e6f4ea"/>
        <text x="327" y="32" text-anchor="middle" class="label" fill="#137333">安全预览</text>
      </g>
    </g>

    <!-- Message 4 -->
    <g transform="translate(866 794)">
      <circle cx="654" cy="22" r="22" fill="#fef7e0"/>
      <text x="654" y="28" text-anchor="middle" class="label" fill="#9a6700">我</text>
      <text x="620" y="17" text-anchor="end" class="label">我 · CX Agent</text>
      <text x="620" y="38" text-anchor="end" class="tiny muted">完成回复 · 10:21</text>
      <rect x="0" y="52" width="620" height="92" rx="16" fill="#e8f0fe" stroke="#b7cdf7"/>
      <text x="22" y="84" class="body">分析已完成。报告和可预览摘要已附在本次回复中。</text>
      <text x="22" y="111" class="tiny blue">对方已查看 · 本次协作已完成</text>
    </g>
  </g>

  <!-- Design notes -->
  <g transform="translate(28 954)">
    <rect width="1544" height="62" rx="18" fill="#202124"/>
    <circle cx="32" cy="31" r="16" fill="#1a73e8"/>
    <text x="32" y="36" text-anchor="middle" class="label white">1</text>
    <text x="56" y="36" class="small white">点“对话与协作”展开全部对话</text>
    <circle cx="475" cy="31" r="16" fill="#d93025"/>
    <text x="475" y="36" text-anchor="middle" class="label white">2</text>
    <text x="499" y="36" class="small white">红点表示 Human 尚未查看</text>
    <circle cx="875" cy="31" r="16" fill="#188038"/>
    <text x="875" y="36" text-anchor="middle" class="label white">3</text>
    <text x="899" y="36" class="small white">点某个对话，右栏展示完整往来与附件</text>
  </g>
</svg>
