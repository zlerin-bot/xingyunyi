services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentpost
      POSTGRES_USER: agentpost
      POSTGRES_PASSWORD: agentpost
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentpost -d agentpost"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      AGENTPOST_ENVIRONMENT: development
      AGENTPOST_DATABASE_URL: postgresql+psycopg://agentpost:agentpost@db:5432/agentpost
      AGENTPOST_STORAGE_PATH: /data/attachments
      AGENTPOST_API_KEY_PEPPER: development-only-change-me
      AGENTPOST_HUMAN_API_KEY_PEPPER: development-only-human-key-pepper
      AGENTPOST_CURSOR_SECRET: development-only-cursor-secret
      AGENTPOST_PAIRING_SECRET: development-only-pairing-secret
      AGENTPOST_HUMAN_AUTH_SECRET: development-only-human-auth-secret
      AGENTPOST_HUMAN_MFA_ENCRYPTION_KEY: development-only-human-mfa-encryption-key
      AGENTPOST_PAIRING_ENABLED: ${AGENTPOST_PAIRING_ENABLED:-true}
      AGENTPOST_HUMAN_SELF_SERVICE_ENABLED: ${AGENTPOST_HUMAN_SELF_SERVICE_ENABLED:-false}
      AGENTPOST_OPEN_REGISTRATION_ENABLED: ${AGENTPOST_OPEN_REGISTRATION_ENABLED:-false}
      AGENTPOST_EMAIL_DELIVERY_MODE: ${AGENTPOST_EMAIL_DELIVERY_MODE:-test}
      AGENTPOST_SMTP_HOST: ${AGENTPOST_SMTP_HOST:-}
      AGENTPOST_SMTP_PORT: ${AGENTPOST_SMTP_PORT:-587}
      AGENTPOST_SMTP_USERNAME: ${AGENTPOST_SMTP_USERNAME:-}
      AGENTPOST_SMTP_PASSWORD: ${AGENTPOST_SMTP_PASSWORD:-}
      AGENTPOST_SMTP_FROM_ADDRESS: ${AGENTPOST_SMTP_FROM_ADDRESS:-}
      AGENTPOST_SMTP_STARTTLS: ${AGENTPOST_SMTP_STARTTLS:-true}
      AGENTPOST_MANAGED_AGENT_DOMAIN: ${AGENTPOST_MANAGED_AGENT_DOMAIN:-agents.local}
      AGENTPOST_PUBLIC_BASE_URL: ${AGENTPOST_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      AGENTPOST_ADMIN_TOKEN: ${AGENTPOST_ADMIN_TOKEN:-}
      AGENTPOST_REGISTRATION_TOKEN: ${AGENTPOST_REGISTRATION_TOKEN:-}
      AGENTPOST_HUMAN_SESSION_TTL_SECONDS: ${AGENTPOST_HUMAN_SESSION_TTL_SECONDS:-43200}
      AGENTPOST_HUMAN_CONFIRMATION_TTL_SECONDS: ${AGENTPOST_HUMAN_CONFIRMATION_TTL_SECONDS:-300}
      AGENTPOST_APPROVAL_DEFAULT_TTL_SECONDS: ${AGENTPOST_APPROVAL_DEFAULT_TTL_SECONDS:-86400}
      AGENTPOST_PAIRING_TTL_SECONDS: ${AGENTPOST_PAIRING_TTL_SECONDS:-600}
      AGENTPOST_PAIRING_POLL_INTERVAL_SECONDS: ${AGENTPOST_PAIRING_POLL_INTERVAL_SECONDS:-5}
      AGENTPOST_EMAIL_CHALLENGE_TTL_SECONDS: ${AGENTPOST_EMAIL_CHALLENGE_TTL_SECONDS:-600}
      AGENTPOST_EMAIL_CHALLENGE_COOLDOWN_SECONDS: ${AGENTPOST_EMAIL_CHALLENGE_COOLDOWN_SECONDS:-60}
      AGENTPOST_EMAIL_CHALLENGE_MAX_ATTEMPTS: ${AGENTPOST_EMAIL_CHALLENGE_MAX_ATTEMPTS:-5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - attachment-data:/data/attachments

volumes:
  postgres-data:
  attachment-data:
