[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentpost"
version = "0.1.0"
description = "Protocol-first asynchronous messaging infrastructure for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "httpx2>=2,<3",
  "jsonschema>=4.23,<5",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.7,<1",
]
mcp = ["mcp>=1.2,<2"]

[project.scripts]
agentpost-api = "agentpost.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpost"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "postgres: requires a running PostgreSQL database",
  "e2e: end-to-end acceptance scenario",
  "concurrency: concurrent behavior test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
