name: agentpost

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backend
    logging: *default-logging

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      AGENTPOST_ENVIRONMENT: production
      AGENTPOST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      AGENTPOST_STORAGE_PATH: /data/attachments
      AGENTPOST_LOG_LEVEL: ${AGENTPOST_LOG_LEVEL:-INFO}
      AGENTPOST_API_KEY_PEPPER: ${AGENTPOST_API_KEY_PEPPER:?AGENTPOST_API_KEY_PEPPER is required}
      AGENTPOST_HUMAN_API_KEY_PEPPER: ${AGENTPOST_HUMAN_API_KEY_PEPPER:?AGENTPOST_HUMAN_API_KEY_PEPPER is required}
      AGENTPOST_CURSOR_SECRET: ${AGENTPOST_CURSOR_SECRET:?AGENTPOST_CURSOR_SECRET is required}
      AGENTPOST_PAIRING_SECRET: ${AGENTPOST_PAIRING_SECRET:?AGENTPOST_PAIRING_SECRET is required}
      AGENTPOST_HUMAN_AUTH_SECRET: ${AGENTPOST_HUMAN_AUTH_SECRET:?AGENTPOST_HUMAN_AUTH_SECRET is required}
      AGENTPOST_HUMAN_MFA_ENCRYPTION_KEY: ${AGENTPOST_HUMAN_MFA_ENCRYPTION_KEY:?AGENTPOST_HUMAN_MFA_ENCRYPTION_KEY is required}
      AGENTPOST_OAUTH_TOKEN_PEPPER: ${AGENTPOST_OAUTH_TOKEN_PEPPER:?AGENTPOST_OAUTH_TOKEN_PEPPER is required}
      AGENTPOST_RATE_LIMIT_SECRET: ${AGENTPOST_RATE_LIMIT_SECRET:?AGENTPOST_RATE_LIMIT_SECRET is required}
      AGENTPOST_PAIRING_ENABLED: ${AGENTPOST_PAIRING_ENABLED:-false}
      AGENTPOST_HUMAN_SELF_SERVICE_ENABLED: ${AGENTPOST_HUMAN_SELF_SERVICE_ENABLED:-false}
      AGENTPOST_OPEN_REGISTRATION_ENABLED: ${AGENTPOST_OPEN_REGISTRATION_ENABLED:-false}
      AGENTPOST_REMOTE_MCP_OAUTH_ENABLED: ${AGENTPOST_REMOTE_MCP_OAUTH_ENABLED:-false}
      AGENTPOST_ENTERPRISE_OIDC_ENABLED: ${AGENTPOST_ENTERPRISE_OIDC_ENABLED:-false}
      AGENTPOST_OIDC_ALLOWED_ISSUERS: ${AGENTPOST_OIDC_ALLOWED_ISSUERS:-}
      AGENTPOST_EMAIL_DELIVERY_MODE: ${AGENTPOST_EMAIL_DELIVERY_MODE:-smtp}
      AGENTPOST_SMTP_HOST: ${AGENTPOST_SMTP_HOST:-}
      AGENTPOST_SMTP_PORT: ${AGENTPOST_SMTP_PORT:-587}
      AGENTPOST_SMTP_USERNAME: ${AGENTPOST_SMTP_USERNAME:-}
      AGENTPOST_SMTP_PASSWORD: ${AGENTPOST_SMTP_PASSWORD:-}
      AGENTPOST_SMTP_FROM_ADDRESS: ${AGENTPOST_SMTP_FROM_ADDRESS:-}
      AGENTPOST_SMTP_STARTTLS: ${AGENTPOST_SMTP_STARTTLS:-true}
      AGENTPOST_SMTP_SSL: ${AGENTPOST_SMTP_SSL:-false}
      AGENTPOST_MANAGED_AGENT_DOMAIN: ${AGENTPOST_MANAGED_AGENT_DOMAIN:-agentpost.me}
      AGENTPOST_PUBLIC_BASE_URL: ${AGENTPOST_PUBLIC_BASE_URL:-https://agentpost.me}
      AGENTPOST_REMOTE_MCP_RESOURCE_URL: ${AGENTPOST_REMOTE_MCP_RESOURCE_URL:-https://agentpost.me/mcp}
      AGENTPOST_CODEX_SETUP_PLATFORMS: ${AGENTPOST_CODEX_SETUP_PLATFORMS:-}
      AGENTPOST_WORKBUDDY_SETUP_PLATFORMS: ${AGENTPOST_WORKBUDDY_SETUP_PLATFORMS:-}
      AGENTPOST_OPENCLAW_SETUP_PLATFORMS: ${AGENTPOST_OPENCLAW_SETUP_PLATFORMS:-}
      AGENTPOST_HERMES_SETUP_PLATFORMS: ${AGENTPOST_HERMES_SETUP_PLATFORMS:-}
      AGENTPOST_CONNECTOR_RELEASE_VERSION: ${AGENTPOST_CONNECTOR_RELEASE_VERSION:-0.1.11}
      AGENTPOST_CONNECTOR_WHEEL_URL: ${AGENTPOST_CONNECTOR_WHEEL_URL:-https://agentpost.me/downloads/agentpost-0.1.11-py3-none-any.whl}
      AGENTPOST_CONNECTOR_WHEEL_SHA256: ${AGENTPOST_CONNECTOR_WHEEL_SHA256:?AGENTPOST_CONNECTOR_WHEEL_SHA256 is required}
      AGENTPOST_REGISTRATION_TOKEN: ${AGENTPOST_REGISTRATION_TOKEN:?AGENTPOST_REGISTRATION_TOKEN is required}
      AGENTPOST_ADMIN_TOKEN: ${AGENTPOST_ADMIN_TOKEN:?AGENTPOST_ADMIN_TOKEN is required}
      AGENTPOST_MAX_ATTACHMENT_BYTES: ${AGENTPOST_MAX_ATTACHMENT_BYTES:-10485760}
      AGENTPOST_HUMAN_SESSION_TTL_SECONDS: ${AGENTPOST_HUMAN_SESSION_TTL_SECONDS:-43200}
      AGENTPOST_HUMAN_CONFIRMATION_TTL_SECONDS: ${AGENTPOST_HUMAN_CONFIRMATION_TTL_SECONDS:-300}
      AGENTPOST_APPROVAL_DEFAULT_TTL_SECONDS: ${AGENTPOST_APPROVAL_DEFAULT_TTL_SECONDS:-86400}
      AGENTPOST_PAIRING_TTL_SECONDS: ${AGENTPOST_PAIRING_TTL_SECONDS:-600}
      AGENTPOST_PAIRING_POLL_INTERVAL_SECONDS: ${AGENTPOST_PAIRING_POLL_INTERVAL_SECONDS:-5}
      AGENTPOST_EMAIL_CHALLENGE_IP_LIMIT: ${AGENTPOST_EMAIL_CHALLENGE_IP_LIMIT:-20}
      AGENTPOST_EMAIL_CHALLENGE_ADDRESS_LIMIT: ${AGENTPOST_EMAIL_CHALLENGE_ADDRESS_LIMIT:-5}
      AGENTPOST_EMAIL_CHALLENGE_RATE_WINDOW_SECONDS: ${AGENTPOST_EMAIL_CHALLENGE_RATE_WINDOW_SECONDS:-3600}
      AGENTPOST_HUMAN_LOGIN_IP_LIMIT: ${AGENTPOST_HUMAN_LOGIN_IP_LIMIT:-60}
      AGENTPOST_HUMAN_LOGIN_ACCOUNT_LIMIT: ${AGENTPOST_HUMAN_LOGIN_ACCOUNT_LIMIT:-10}
      AGENTPOST_HUMAN_LOGIN_RATE_WINDOW_SECONDS: ${AGENTPOST_HUMAN_LOGIN_RATE_WINDOW_SECONDS:-900}
      AGENTPOST_PAIRING_CREATE_IP_LIMIT: ${AGENTPOST_PAIRING_CREATE_IP_LIMIT:-30}
      AGENTPOST_PAIRING_POLL_IP_LIMIT: ${AGENTPOST_PAIRING_POLL_IP_LIMIT:-1200}
      AGENTPOST_PAIRING_RATE_WINDOW_SECONDS: ${AGENTPOST_PAIRING_RATE_WINDOW_SECONDS:-3600}
      AGENTPOST_OIDC_STATE_TTL_SECONDS: ${AGENTPOST_OIDC_STATE_TTL_SECONDS:-600}
      AGENTPOST_OIDC_HTTP_TIMEOUT_SECONDS: ${AGENTPOST_OIDC_HTTP_TIMEOUT_SECONDS:-10}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - attachment-data:/data/attachments
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  remote-mcp:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["agentpost-mcp-http"]
    restart: unless-stopped
    environment:
      AGENTPOST_SERVER: http://api:8000
      AGENTPOST_OAUTH_ISSUER: ${AGENTPOST_PUBLIC_BASE_URL:-https://agentpost.me}
      AGENTPOST_MCP_RESOURCE_URL: ${AGENTPOST_REMOTE_MCP_RESOURCE_URL:-https://agentpost.me/mcp}
      AGENTPOST_MCP_HOST: 0.0.0.0
      AGENTPOST_MCP_PORT: 8001
      AGENTPOST_MCP_ALLOWED_HOSTS: ${AGENTPOST_MCP_ALLOWED_HOSTS:?AGENTPOST_MCP_ALLOWED_HOSTS is required}
      AGENTPOST_MCP_ALLOWED_ORIGINS: ${AGENTPOST_MCP_ALLOWED_ORIGINS:?AGENTPOST_MCP_ALLOWED_ORIGINS is required}
      AGENTPOST_MCP_LOG_LEVEL: ${AGENTPOST_LOG_LEVEL:-INFO}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8001"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8001), timeout=3).close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      AGENTPOST_SITE_ADDRESS: ${AGENTPOST_SITE_ADDRESS:?AGENTPOST_SITE_ADDRESS is required}
      AGENTPOST_ACME_EMAIL: ${AGENTPOST_ACME_EMAIL:?AGENTPOST_ACME_EMAIL is required}
    depends_on:
      api:
        condition: service_healthy
      remote-mcp:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    logging: *default-logging

networks:
  backend:
    internal: false

volumes:
  postgres-data:
  attachment-data:
  caddy-data:
  caddy-config:
